<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<meta name="description" content="RELAY-3 TEAM HUB">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>RELAY-3 TEAM HUB</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#030a12;color:#f4f8fb}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{width:min(430px,92vw);background:#081827;border:1px solid #1d4664;border-radius:28px;padding:28px;box-shadow:0 20px 70px #0009;text-align:center}
.logo{width:110px;height:110px;object-fit:contain;margin:0 auto 14px;display:block}
h1{margin:0;font-size:27px}
.sub{color:#91b4cc;font-size:14px;margin:8px 0 28px}
label{display:block;text-align:left;color:#9bc2da;font-size:12px;margin-bottom:8px}
select{width:100%;height:50px;border-radius:13px;border:1px solid #24516f;background:#06131f;color:#fff;padding:0 14px;font-size:16px;outline:none}
button{width:100%;height:50px;margin-top:16px;border:0;border-radius:13px;background:#19bce5;color:#031018;font-size:15px;font-weight:800;cursor:pointer}
button:active{transform:scale(.99)}
.status{margin-top:18px;color:#8fb2c8;font-size:11px;line-height:1.6}
.badge{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:30px;background:#07334a;color:#53d8ff;font-size:10px}
.loading{font-size:14px;color:#8fb2c8}
.error{color:#ff7373}
.hidden{display:none}
</style>
</head>

<body>

<div class="wrap" id="login">
  <img class="logo" src="./icon-192.png" alt="RELAY-3 TEAM HUB">

  <h1>Welcome to RELAY-3</h1>
  <div class="sub">Select your name to continue</div>

  <label for="user">OPERATOR / USER</label>
  <select id="user">
    <option>Loading...</option>
  </select>

  <button id="continueBtn">CONTINUE</button>

  <div class="status">
    Operator names are loaded directly from the existing Relay-3 Google Sheet through the R3 backend.<br>
    Security and Guest permissions are controlled by the Google Sheet.
  </div>

  <div class="badge" id="connection">● CONNECTING TO R3 BACKEND</div>
</div>

<script>
const R3_URL="https://script.google.com/macros/s/AKfycbyHQ5BMKG-IHIGMCqL4N2efVOshdsP34EY3Gu054YwmhC5qYZBNyEkRvW0_3SAOmMK8fA/exec";
const KEY="relay3_team_hub_user";

function jsonp(url,params={}){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");

    params.callback=cb;
    const q=new URLSearchParams(params);

    window[cb]=data=>{
      cleanup();
      resolve(data);
    };

    s.onerror=()=>{
      cleanup();
      reject(new Error("R3 backend connection failed"));
    };

    s.src=url+"?"+q.toString();
    document.body.appendChild(s);

    function cleanup(){
      delete window[cb];
      s.remove();
    }
  });
}

async function loadUsers(){
  const select=document.getElementById("user");
  const connection=document.getElementById("connection");

  try{
    const data=await jsonp(R3_URL,{action:"getDashboardData"});

    const operators=Array.isArray(data.operators)?data.operators:[];
    const names=["Guest",...operators];

    select.innerHTML="";

    names.forEach(name=>{
      const option=document.createElement("option");
      option.value=name;
      option.textContent=name;
      select.appendChild(option);
    });

    const saved=localStorage.getItem(KEY);

    if(saved && names.includes(saved)){
      select.value=saved;
    }

    connection.textContent="● R3 BACKEND CONNECTED";
    connection.classList.remove("error");

    window.r3Data=data;

  }catch(err){
    select.innerHTML='<option value="Guest">Guest</option>';
    connection.textContent="● R3 BACKEND CONNECTION ERROR";
    connection.classList.add("error");
  }
}

document.getElementById("continueBtn").addEventListener("click",()=>{
  const user=document.getElementById("user").value;

  if(!user || user==="Loading..."){
    return;
  }

  localStorage.setItem(KEY,user);

  alert(
    "Logged in as "+user+
    "\\n\\nRELAY-3 TEAM HUB dashboard will be enabled in the next step."
  );
});

loadUsers();

/*
  Remove any old service worker and register the new one.
*/
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(reg=>{
      reg.unregister();
    });
  }).catch(()=>{});
}
</script>

</body>
</html>
